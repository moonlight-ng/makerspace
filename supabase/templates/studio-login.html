<!doctype html>
<html lang="en">
<body style="margin:0;background:#faf9f5;color:#121212;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;">
    <div style="max-width:560px;margin:0 auto;padding:48px 24px;">
        <p style="margin:0 0 56px;font-size:14px;font-weight:700;">Makerspace</p>
        <p style="margin:0 0 12px;color:#73736d;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;">Private Studio</p>
        <h1 style="margin:0 0 24px;font-family:Georgia,Times New Roman,serif;font-size:42px;font-weight:400;line-height:1;">Your login code</h1>
        <p style="margin:0 0 20px;color:#55554f;font-size:16px;line-height:1.5;">Enter this six-digit code on the Studio login screen:</p>
        <p style="margin:0 0 28px;padding:20px 24px;border:1px solid rgba(18,18,18,.18);background:#fff;font-size:30px;font-weight:600;letter-spacing:.28em;">{{ .Token }}</p>
        <p style="margin:0;color:#73736d;font-size:13px;line-height:1.5;">The code expires in ten minutes. If you didn’t request it, you can safely ignore this email.</p>
    </div>
</body>
</html>
